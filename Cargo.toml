[workspace]
members = ["byods/ascent-byods-rels", "ascent", "ascent_base", "ascent_dd_runtime", "ascent_macro"]
exclude = ["ascent_tests", "ascent_tests_dd", "wasm-tests"]
resolver = "2"

[workspace.package]
version = "0.8.0"

[workspace.dependencies]
ascent = { path = "./ascent", default-features = false, version = "0.8.0" }
ascent_macro = { path = "./ascent_macro", version = "0.8.0" }
ascent_base = { path = "./ascent_base", version = "0.8.0" }
ascent_dd_runtime = { path = "./ascent_dd_runtime", version = "0.8.0" }
