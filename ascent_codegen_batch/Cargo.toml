[package]
name = "ascent_codegen_batch"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Batch (non-DD) codegen backend for Ascent MIR (proc-macro)"

[lib]
proc-macro = true

[dependencies]
ascent_mir = { workspace = true }
syn = { version = "2.0.57", features = ["derive", "full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
itertools = "0.13"
