[package]
name = "ascent_dd_runtime"
version.workspace = true
edition = "2021"
description = "Runtime support for the ascent macro's differential-dataflow backend"
license = "MIT"

[dependencies]
# DD 0.20 matches FlowLog exactly so generated code can be diff'd directly.
# Breaking changes vs 0.17:
#   - `Collection<G, D, R>` → `Collection<G, C>` (D/R moved into Container).
#     We alias `VecCollection<G, D, R>` back to `Collection` in codegen.
#   - `SemigroupVariable` merged into `Variable` (accepts R: Semigroup now).
#   - `Join`/`Reduce`/`Threshold` bulk traits removed; `arrange_by_*`,
#     `consolidate`, `join_core`, etc. are inherent methods on Collection
#     or Arranged — no trait imports required.
#   - `.inspect()` takes self by value — codegen clones the `&Collection`.
timely = { version = "0.27", default-features = false }
differential-dataflow = { version = "0.20", default-features = false }
# For the LatDiff wrapper's `ascent_base::Lattice` bound.
ascent_base = { workspace = true, features = ["serde"] }
# `OrderedFloat` wraps `f32`/`f64` with a total order (NaN > +∞, NaN == NaN).
# Needed so aggregator outputs like `mean() → f64` can live in a DD Collection
# (which requires `Ord` on value types).
ordered-float = { version = "4", default-features = false, features = ["serde"] }
