[package]
name = "bench_cspa"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
ascent = { path = "../../ascent", features = ["dd"] }
bench_loader = { path = "../bench_loader" }

[[bin]]
name = "cspa_batch"
path = "src/cspa_batch.rs"

[[bin]]
name = "cspa_dd"
path = "src/cspa_dd.rs"

[[bin]]
name = "cspa_dd_inc"
path = "src/cspa_dd_inc.rs"

[[bin]]
name = "tc_inc_test"
path = "src/tc_inc_test.rs"

[[bin]]
name = "cspa_manual"
path = "src/cspa_manual.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
