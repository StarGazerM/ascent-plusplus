[package]
name = "bench_cspa"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Local path — needed for `#[backend(dd)]`. The `par` feature is implicit
# via the default feature set.
ascent = { path = "../../ascent", features = ["dd"] }
memmap2 = "0.9"

[lib]
name = "bench_cspa_lib"
path = "src/loader.rs"

[[bin]]
name = "cspa_batch"
path = "src/cspa_batch.rs"

[[bin]]
name = "cspa_dd"
path = "src/cspa_dd.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
